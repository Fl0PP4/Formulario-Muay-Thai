<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Jogador - Torneio de Muay Thai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Cadastro - Torneio de Muay Thai</h1>
        </div>
        <div class="content">

        <form id="cadastroForm">
            
            <h2>Dados Pessoais</h2>
            
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" maxlength="100" required placeholder="Digite seu nome completo">

            <div class="grid">
                <div>
                    <label for="dataNascimento">Data de Nascimento *</label>
                    <input type="date" id="dataNascimento" required>
                </div>
                <div>
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" maxlength="11" required placeholder="00000000000" 
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>

            <div class="grid">
                <div>
                    <label for="rg">RG</label>
                    <input type="text" id="rg" maxlength="12" placeholder="0000000000">
                </div>
                <div>
                    <label for="telefone">Telefone / WhatsApp *</label>
                    <input type="tel" id="telefone" maxlength="15" required placeholder="(00) 00000-0000">
                </div>
            </div>

            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="seuemail@exemplo.com">

            
            <h2>Endereço</h2>
            
            <div class="grid">
                <div>
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" maxlength="8" required placeholder="00000000"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <div>
                    <label for="estado">Estado</label>
                    <select id="estado" required>
                        <option value="">Selecione</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                         <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>
            </div>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" maxlength="150" placeholder="Rua, Avenida...">

            <div class="grid">
                <div>
                    <label for="numero">Número</label>
                    <input type="text" id="numero" maxlength="10">
                </div>
                <div>
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" maxlength="80">
                </div>
            </div>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" maxlength="80">

            
            <h2>Dados para o Torneio</h2>
            
            <div class="grid">
                <div>
                    <label for="peso">Peso (kg) *</label>
                    <input type="number" id="peso" step="0.1" min="40" max="150" required>
                </div>
                <div>
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione a categoria</option>
                        <option value="Mosca">Mosca (-52kg)</option>
                        <option value="Galo">Galo (-57kg)</option>
                        <option value="Pena">Pena (-62kg)</option>
                        <option value="Leve">Leve (-67kg)</option>
                        <option value="Meio-médio">Meio-médio (-72kg)</option>
                        <option value="Médio">Médio (-77kg)</option>
                        <option value="Meio-pesado">Meio-pesado (-83kg)</option>
                        <option value="Pesado">Pesado (-90kg)</option>
                        <option value="Super-pesado">Super-pesado (+90kg)</option>
                    </select>
                </div>
            </div>

            <label for="experiencia">Experiência / Faixa</label>
            <select id="experiencia">
                <option value="">Selecione</option>
                <option value="Iniciante">Iniciante</option>
                <option value="Intermediario">Intermediário</option>
                <option value="Avancado">Avançado</option>
                <option value="Profissional">Profissional</option>
            </select>

            <label for="observacoes">Observações ou Lesões Pré-existentes</label>
            <textarea id="observacoes" rows="4" maxlength="500" placeholder="Informe qualquer informação relevante..."></textarea>

            <button type="submit">Enviar Cadastro</button>
        </form>

        <div class="info">
            Todos os campos com * são obrigatórios.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
